/* ---------- Dashboard ---------- */

function Dashboard({ cases, itemDirectory, docLogs }) {
  const today = new Date().toISOString().slice(0, 10);
  const monthStart = today.slice(0, 8) + "01";
  const [rangeStart, setRangeStart] = useState(monthStart);
  const [rangeEnd, setRangeEnd] = useState(today);
  const setPrintDoc = useContext(PrintContext);

  const dealsThisMonth = cases.filter(c => inRange(firstPaymentDate(c), rangeStart, rangeEnd));
  const installedThisMonth = cases.filter(c => installComplete(c) && inRange(lastInstallDate(c), rangeStart, rangeEnd));

  const byType = (list) => PROPERTY_TYPES.map(p => ({ type: p.v, label: `${p.v} ${p.en}`, icon: p.icon, count: list.filter(c => c.pkg.propertyType === p.v).length }));

  const stageCounts = {};
  cases.forEach(c => { const st = stageOf(c); const key = `${st.label} ${st.en}`; stageCounts[key] = (stageCounts[key] || 0) + 1; });

  const buckets = [
    { label: "0–29%", test: (p) => p < 30, color: "#C24141" },
    { label: "30–59%", test: (p) => p >= 30 && p < 60, color: "#D98C3D" },
    { label: "60–99%", test: (p) => p >= 60 && p < 100, color: "#C89B3C" },
    { label: "100%", test: (p) => p >= 100, color: "#3C8C63" },
  ].map(b => ({ ...b, count: cases.filter(c => b.test(paymentPercent(c))).length }));

  const totalValue = cases.reduce((s, c) => s + (Number(c.pkg.sellingPrice) || 0), 0);
  const completedCases = cases.filter(c => stageOf(c).label === "已完成").length;

  const [reportAgent, setReportAgent] = useState("全部");
  const agentNames = Array.from(new Set(cases.map(c => c.agentName).filter(Boolean))).sort();
  const reportCases = reportAgent === "全部" ? cases : cases.filter(c => c.agentName === reportAgent);
  // Wraps every report so picking a single Agent above also stamps that onto the printed
  // report's title/header — without needing to touch each individual report-builder function.
  const printReport = (doc) => {
    if (reportAgent === "全部") { setPrintDoc(doc); return; }
    setPrintDoc({
      title: `${doc.title} · ${reportAgent}`,
      html: doc.html.replace("</h1>", ` &nbsp;·&nbsp; Agent: ${reportAgent}</h1>`),
    });
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 22 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>
        <h2 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 20, margin: 0, color: "#1B2430" }}>数据总览 Dashboard</h2>
        <div style={{ display: "flex", gap: 10, alignItems: "flex-end" }}>
          <Field label="统计区间 从 From"><DateInputDMY value={rangeStart} onChange={e => setRangeStart(e.target.value)} /></Field>
          <Field label="到 To"><DateInputDMY value={rangeEnd} onChange={e => setRangeEnd(e.target.value)} /></Field>
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12 }}>
        <StatCard label="总Case数 Total Cases" value={cases.length} sub="全部 All" />
        <StatCard label="总成交额 Total Value" value={fmtMoney(totalValue)} sub="全部cases All Cases" />
        <StatCard label="已完成 Case Completed" value={completedCases} sub="Completed" color="#3C8C63" />
      </div>

      <Panel title="报告中心 Report Center" sub={`选好上方日期区间后点按钮，报告会在下方视窗显示，可直接「打印 / 另存为PDF」— 当前区间：${dateRangeLabel(rangeStart, rangeEnd)}`}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4, flexWrap: "wrap" }}>
          <Field label="报告只看 Agent Agent Filter（老板要看单一 Agent 的报告就用这个）">
            <select value={reportAgent} onChange={e => setReportAgent(e.target.value)} style={{ ...inputStyle, width: 220 }}>
              <option value="全部">全部 Agent All Agents</option>
              {agentNames.map(a => <option key={a} value={a}>{a}</option>)}
            </select>
          </Field>
          {reportAgent !== "全部" && (
            <span style={{ fontSize: 11.5, color: "#2C5F8A", background: "#F0F6FB", border: "1px solid #CFE2F0", borderRadius: 6, padding: "4px 8px", alignSelf: "flex-end", marginBottom: 2 }}>
              下面所有报告都只算 <b>{reportAgent}</b> 的 case（共 {reportCases.length} 个）
            </span>
          )}
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          <ReportGroup label="定金 / 付款进度 Deposit / Payment Progress" color={DEPT.payment.color}>
            <ReportBtn onClick={() => printReport(buildAgentFullListReportDoc(reportCases))}>Agent 全部 Case 名单 Agent Full Case List</ReportBtn>
            <ReportBtn onClick={() => printReport(buildDepositReportDoc(rangeStart, rangeEnd, reportCases))}>定金报告 Deposit Report</ReportBtn>
            <ReportBtn onClick={() => printReport(buildPaymentThresholdReportDoc(60, rangeStart, rangeEnd, reportCases))}>60%以上付款 60%+ Paid</ReportBtn>
            <ReportBtn onClick={() => printReport(buildPaymentThresholdReportDoc(80, rangeStart, rangeEnd, reportCases))}>80%以上付款（佣金门槛） 80%+ Paid (Commission Threshold)</ReportBtn>
            <ReportBtn onClick={() => printReport(buildPaymentThresholdReportDoc(100, rangeStart, rangeEnd, reportCases))}>全额付款 Full Payment</ReportBtn>
            <ReportBtn onClick={() => printReport(buildPendingLoReportDoc(reportCases))}>等待LO Pending Letter of Offer</ReportBtn>
          </ReportGroup>
          <ReportGroup label="SEDA" color={DEPT.seda.color}>
            <ReportBtn onClick={() => printReport(buildSedaReportDoc(rangeStart, rangeEnd, reportCases))}>SEDA 申请报告 SEDA Application Report</ReportBtn>
            <ReportBtn onClick={() => printReport(buildPendingSedaSubmissionReportDoc(reportCases))}>待提交SEDA Pending SEDA Submission</ReportBtn>
          </ReportGroup>
          <ReportGroup label="TNB" color={DEPT.tnb.color}>
            <ReportBtn onClick={() => printReport(buildTnbReportDoc(rangeStart, rangeEnd, reportCases))}>TNB 申请报告 TNB Application Report</ReportBtn>
            <ReportBtn onClick={() => printReport(buildPendingTnbApplicationReportDoc(reportCases))}>待申请TNB Pending TNB Application</ReportBtn>
          </ReportGroup>
          <ReportGroup label="安装 / O&M / 汇总 Install / O&M / Summary" color={DEPT.install.color}>
            <ReportBtn onClick={() => printReport(buildInstallReportDoc(rangeStart, rangeEnd, reportCases))}>安装报告 Install Report</ReportBtn>
            <ReportBtn onClick={() => printReport(buildOutstandingAfterInstallReportDoc(reportCases))}>已安装未收全款 Installed but Not Fully Paid</ReportBtn>
            <ReportBtn onClick={() => printReport(buildInstallQueueReportDoc(reportCases))}>安装排队 Install Queue</ReportBtn>
            <ReportBtn onClick={() => printReport(buildShipmentReportDoc(rangeStart, rangeEnd, reportCases, itemDirectory))}>出货量报告 Shipment Report</ReportBtn>
            <ReportBtn onClick={() => printReport(buildOMReportDoc(reportCases))}>O&M 报告 O&M Report</ReportBtn>
            <ReportBtn onClick={() => printReport(buildPropertyTypeSummaryDoc(rangeStart, rangeEnd, reportCases))}>物业类型汇总 Property Type Summary</ReportBtn>
          </ReportGroup>
          <ReportGroup label="取消配套 Cancelled Packages" color={DEPT.cancellation.color}>
            <ReportBtn onClick={() => printReport(buildCancellationReportDoc(rangeStart, rangeEnd, reportCases))}>取消配套报告 Cancellation Report</ReportBtn>
          </ReportGroup>
          <ReportGroup label="文件记录 Document Log" color="#6B4E9E">
            <ReportBtn onClick={() => printReport(buildDocLogReportDoc(rangeStart, rangeEnd, reportCases, docLogs))}>文件记录 Document Log（Quotation / Invoice 生成记录）</ReportBtn>
          </ReportGroup>
        </div>
      </Panel>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
        <Panel title={`成交 Deals · ${dateRangeLabel(rangeStart, rangeEnd)}`} sub={`共 ${dealsThisMonth.length} 个 case（以首次付款日期归类 By first payment date）`}>
          <TypeBars data={byType(dealsThisMonth)} />
          <CaseMiniList list={dealsThisMonth} emptyText="这段期间没有新定金 case No new deposits in this period" />
        </Panel>
        <Panel title={`安装完成 Installed · ${dateRangeLabel(rangeStart, rangeEnd)}`} sub={`共 ${installedThisMonth.length} 个 case`}>
          <TypeBars data={byType(installedThisMonth)} />
          <CaseMiniList list={installedThisMonth} emptyText="这段期间没有完成安装的 case No installs completed in this period" />
        </Panel>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
        <Panel title="进度阶段分布 Stage Distribution" sub="全部 case All Cases">
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {Object.entries(stageCounts).map(([label, count]) => (
              <div key={label} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ fontSize: 12.5, width: 220, color: "#1B2430" }}>{label}</span>
                <div style={{ flex: 1, height: 8, background: "#F0ECE1", borderRadius: 6, overflow: "hidden" }}>
                  <div style={{ width: `${(count / Math.max(1,cases.length)) * 100}%`, height: "100%", background: "#0B2A4A" }} />
                </div>
                <span style={{ fontSize: 12.5, fontFamily: "'IBM Plex Mono', monospace", width: 24, textAlign: "right" }}>{count}</span>
              </div>
            ))}
          </div>
        </Panel>
        <Panel title="付款进度分布 Payment Progress Distribution" sub="全部 case All Cases">
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {buckets.map(b => (
              <div key={b.label} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ fontSize: 12.5, width: 160, color: "#1B2430" }}>{b.label}</span>
                <div style={{ flex: 1, height: 8, background: "#F0ECE1", borderRadius: 6, overflow: "hidden" }}>
                  <div style={{ width: `${(b.count / Math.max(1,cases.length)) * 100}%`, height: "100%", background: b.color }} />
                </div>
                <span style={{ fontSize: 12.5, fontFamily: "'IBM Plex Mono', monospace", width: 24, textAlign: "right" }}>{b.count}</span>
              </div>
            ))}
          </div>
        </Panel>
      </div>
    </div>
  );
}

function StatCard({ label, value, sub, color }) {
  return (
    <div style={{ background: "#fff", border: "1px solid #E9E4D8", borderRadius: 14, padding: "14px 16px" }}>
      <div style={{ fontSize: 11.5, color: "#9AA2AD", fontWeight: 600, marginBottom: 6 }}>{label}</div>
      <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 22, fontWeight: 700, color: color || "#1B2430" }}>{value}</div>
      <div style={{ fontSize: 11, color: "#B5AE9E", marginTop: 2 }}>{sub}</div>
    </div>
  );
}
function Panel({ title, sub, children }) {
  return (
    <div style={{ background: "#fff", border: "1px solid #E9E4D8", borderRadius: 14, padding: 16 }}>
      <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 14.5, color: "#1B2430" }}>{title}</div>
      <div style={{ fontSize: 11.5, color: "#9AA2AD", marginBottom: 12 }}>{sub}</div>
      {children}
    </div>

}
function ReportGroup({ label, color, children }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap", paddingBottom: 10, borderBottom: "1px solid #F0ECE1" }}>
      <span style={{
        fontSize: 11.5, fontWeight: 700, color: "#fff", width: 130, flexShrink: 0,
        background: color || "#8A93A0", borderRadius: 7, padding: "5px 9px", lineHeight: 1.25,
      }}>{label}</span>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>{children}</div>
    </div>
  );
}
function ReportBtn({ onClick, children }) {
  return (
    <button onClick={onClick} style={{ ...btnGhost, padding: "6px 12px", fontSize: 12.5 }}>
      <Printer size={12} /> {children}
    </button>
  );
}
function TypeBars({ data }) {
  const max = Math.max(1, ...data.map(d => d.count));
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
      {data.map(d => (
        <div key={d.type} style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <d.icon size={14} color="#8A93A0" />
          <span style={{ fontSize: 12.5, width: 96, color: "#1B2430" }}>{d.label || d.type}</span>
          <div style={{ flex: 1, height: 8, background: "#F0ECE1", borderRadius: 6, overflow: "hidden" }}>
            <div style={{ width: `${(d.count / max) * 100}%`, height: "100%", background: "linear-gradient(90deg,#0B2A4A,#C89B3C)" }} />
          </div>
          <span style={{ fontSize: 12.5, fontFamily: "'IBM Plex Mono', monospace", width: 18, textAlign: "right" }}>{d.count}</span>
        </div>
      ))}
    </div>
  );
}

function CaseMiniList({ list, emptyText }) {
  if (!list.length) return <div style={{ marginTop: 10 }}><Empty text={emptyText} /></div>;
  return null; // the TypeBars chart above already covers this — no need to also list names here
}

  const [email, setEmail] = useState((presetCase && presetCase.referral.email) || "");

  const [bankName, setBankName] = useState((presetCase && presetCase.referral.bankName) || "");
  const [bankAccountNo, setBankAccountNo] = useState((presetCase && presetCase.referral.bankAccountNo) || "");

    <div style={{ minHeight: "100vh", background: "#F7F5F0", fontFamily: "'Inter', sans-serif", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');`}</style>
      <div style={{ background: "#fff", border: "1px solid #E9E4D8", borderRadius: 16, padding: 28, maxWidth: 440, width: "100%" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 18 }}>
          <div style={{ width: 34, height: 34, borderRadius: 9, background: "linear-gradient(135deg,#C89B3C,#0B2A4A)", display: "flex", alignItems: "center", justifyContent: "center" }}>
            <Sun size={18} color="#fff" />
          </div>
          <div>
            <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 15 }}>Eternalgy Sdn. Bhd.</div>
            <div style={{ fontSize: 11, color: "#9AA2AD" }}>转介人银行资料 Referral Bank Details</div>
          </div>
        </div>
        {children}
      </div>
    </div>
  );

  if (!foundCase) {

      const code = manualCode.trim().toUpperCase();

        setTin(match.referral.tin || "");

        {notFound && <div style={{ fontSize: 12, color: "#C24141", marginTop: 6 }}>找不到对应的转介资料，请确认代码是否正确，或联络 Admin。</div>}
        <button onClick={lookup} disabled={!manualCode.trim()}
          style={{ ...btnPrimary, width: "100%", justifyContent: "center", marginTop: 14, opacity: manualCode.trim() ? 1 : 0.45, cursor: manualCode.trim() ? "pointer" : "not-allowed" }}>
          <Search size={14} /> 查找 Find
        </button>
      </>
    );
  }

  const canSubmit = name.trim() && ic.trim() && bankAccountNo.trim() && bankAccountHolder.trim();

  const handleSubmit = () => {
    if (!canSubmit) return;
    const updated = { ...foundCase, referral: { ...foundCase.referral, name, ic, tin, email, date: regDate, bankName, bankAccountNo, bankAccountHolder, bankSubmittedAt: todayISO() } };
    onSubmit(updated);
    setFoundCase(updated);
    setSubmitted(true);
  };

  // Once bank details have already been submitted for this case — whether just now in this
  // session, or earlier via a previous visit to the same link — lock the form. This is what
  // prevents the referrer from repeatedly changing their bank account after submitting.
  if (submitted || foundCase.referral.bankSubmittedAt) {
    return shell(
      <div style={{ textAlign: "center", padding: "20px 0" }}>
        <CheckCircle2 size={32} color="#3C8C63" style={{ marginBottom: 10 }} />
        <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 6 }}>{submitted ? "提交成功 Submitted" : "资料已提交 Already Submitted"}</div>
        <div style={{ fontSize: 13, color: "#6B7686", marginBottom: 4 }}>
          {submitted ? "谢谢你，你的资料已经送到 Eternalgy，我们会尽快处理。" : `你已经在 ${fmtDate(foundCase.referral.bankSubmittedAt)} 提交过资料了。`}
        </div>
        <div style={{ fontSize: 12, color: "#9AA2AD" }}>这个链接只能提交一次，如需更正资料，请直接联络 Admin。<br/>This link can only be used once. Contact Admin if you need to correct anything.</div>
      </div>
    );
  }

  return shell(
    <>
      <div style={{ fontSize: 13.5, color: "#1B2430", marginBottom: 4 }}>你好，</div>
      <div style={{ fontSize: 12.5, color: "#6B7686", marginBottom: 18, lineHeight: 1.6 }}>
        请填写以下资料，用于介绍佣金登记与汇款。<br/>
        <span style={{ color: "#C24141" }}>⚠️ 汇款只接受转介人本人户口，账户持有人姓名必须跟转介人本人姓名一致，不接受第三方户口。</span>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        <Field label="转介人姓名 Full Name">
          <TextInput value={name} onChange={e => setName(e.target.value)} placeholder="与IC姓名一致" />
        </Field>
        <Field label="IC Number">
          <TextInput value={ic} onChange={e => setIc(e.target.value)} placeholder="身份证号码" />
        </Field>
        <Field label="TIN Number（如有）">
          <TextInput value={tin} onChange={e => setTin(e.target.value)} placeholder="TIN号码" />
        </Field>
        <Field label="Email Address">
          <TextInput value={email} onChange={e => setEmail(e.target.value)} placeholder="email@example.com" />
        </Field>
        <Field label="登记日期 Date">
          <DateInputDMY value={regDate} onChange={e => setRegDate(e.target.value)} />
        </Field>
        <div style={{ borderTop: "1px solid #F0ECE1", paddingTop: 12, marginTop: 4, fontSize: 11.5, fontWeight: 700, color: "#9AA2AD", letterSpacing: 0.5 }}>
          银行户口资料 Bank Details
        </div>
        <Field label="银行名称 Bank Name">
          <TextInput value={bankName} onChange={e => setBankName(e.target.value)} placeholder="Maybank / CIMB…" />
        </Field>
        <Field label="银行账号 Account No.">
          <TextInput value={bankAccountNo} onChange={e => setBankAccountNo(e.target.value)} placeholder="账号" />
        </Field>
        <Field label="账户持有人姓名 Account Holder（必须是你本人）">
          <TextInput value={bankAccountHolder} onChange={e => setBankAccountHolder(e.target.value)} placeholder="与IC姓名一致" />
        </Field>
      </div>
      <button onClick={handleSubmit} disabled={!canSubmit}
        style={{ ...btnPrimary, width: "100%", justifyContent: "center", marginTop: 18, opacity: canSubmit ? 1 : 0.45, cursor: canSubmit ? "pointer" : "not-allowed" }}>
        <Save size={14} /> 提交 Submit
      </button>
    </>
  );
}

function App() {
  const [role, setRole] = useState("admin"); // admin | agent
  const [cases, setCases] = useState(null);
  const [agentDirectory, setAgentDirectory] = useState(null);
  const [itemDirectory, setItemDirectory] = useState(null);
  const [adminDirectory, setAdminDirectory] = useState(null);
  const [shipmentBatches, setShipmentBatches] = useState(null);
  const [docLogs, setDocLogs] = useState(null);
  const [currentOperator, setCurrentOperator] = useState(null); // session-only, resets on page reload
  const [pendingLoginAction, setPendingLoginAction] = useState(null); // fn to run after successful login
  const [view, setView] = useState({ screen: "dashboard" }); // dashboard | list | form | detail
  const [search, setSearch] = useState("");
  const [agentFilter, setAgentFilter] = useState("全部");
  const [listRangeStart, setListRangeStart] = useState("");
  const [listRangeEnd, setListRangeEnd] = useState("");
  const [simAgent, setSimAgent] = useState("");
  const [printDoc, setPrintDoc] = useState(null);

  // Live subscriptions rather than a one-time read: anyone else's save reaches this tab within
  // moments, so nobody works from a screen that quietly went stale hours ago. Each subscribe
  // returns its unsubscribe function, which useEffect runs on unmount.
  useEffect(() => subscribeCases(setCases), []);
  useEffect(() => subscribeAgentDirectory(setAgentDirectory), []);
  useEffect(() => subscribeItemDirectory(setItemDirectory), []);
  useEffect(() => subscribeAdminDirectory(setAdminDirectory), []);
  useEffect(() => subscribeShipmentBatches(setShipmentBatches), []);
  useEffect(() => subscribeDocLogs(setDocLogs), []);

  // Every mutation below updates local state with the one changed record and writes that same
  // record through a merging transaction — never the whole array. The incoming snapshot then
  // confirms it.
  const persistCase = useCallback((c) => {
    setCases(prev => mergeRecord(prev, c));
    upsertRecord("cases", c);
  }, []);
  const removeCase = useCallback((id) => {
    setCases(prev => dropRecord(prev, id));
    removeRecord("cases", id);
  }, []);

  const saveAdminAccount = useCallback((account) => {
    setAdminDirectory(prev => mergeRecord(prev, account));
    upsertRecord("adminDirectory", account);
  }, []);
  const deleteAdminAccount = useCallback((id) => {
    setAdminDirectory(prev => dropRecord(prev, id));
    removeRecord("adminDirectory", id);
  }, []);

  // Any action that edits a case (add / edit) requires being "logged in" as a staff member for this
  // session first. If already logged in, run immediately; otherwise show the login gate and queue
  // the action to run right after a successful login.
  const requireLogin = useCallback((action) => {
    if (currentOperator) { action(); return; }
    setPendingLoginAction(() => action);
  }, [currentOperator]);

  const saveAgent = useCallback((agent) => {
    setAgentDirectory(prev => mergeRecord(prev, agent));
    upsertRecord("agentDirectory", agent);
  }, []);
  const deleteAgent = useCallback((id) => {
    setAgentDirectory(prev => dropRecord(prev, id));
    removeRecord("agentDirectory", id);
  }, []);

  const saveItem = useCallback((item) => {
    setItemDirectory(prev => mergeRecord(prev, item));
    upsertRecord("itemDirectory", item);
  }, []);
  const deleteItem = useCallback((id) => {
    setItemDirectory(prev => dropRecord(prev, id));
    removeRecord("itemDirectory", id);
  }, []);

  const saveBatch = useCallback((batch) => {
    setShipmentBatches(prev => mergeRecord(prev, batch));
    upsertRecord("shipmentBatches", batch);
  }, []);
  const deleteBatch = useCallback((id) => {
    setShipmentBatches(prev => dropRecord(prev, id));
    removeRecord("shipmentBatches", id);
  }, []);

  // Records a Quotation/Proforma Invoice generation event and returns the sequence number to
  // print on the document, so every printed doc number traces back to exactly one log entry.
  const logDoc = useCallback((entry) => {
    let seqOut = 1;
    let record = null;
    const newId = uid();
    setDocLogs(prev => {
      const list = prev || [];
      const sameType = list.filter(l => l.docType === entry.docType);
      seqOut = sameType.length + 1;
      record = { id: newId, timestamp: new Date().toISOString(), seq: seqOut, ...entry };
      return [...list, record];
    });
    if (record) upsertRecord("docLogs", record);
    return { seq: seqOut, logId: newId };
  }, []);

  const agents = useMemo(() => {
    if (!cases) return [];
    const fromDirectory = (agentDirectory || []).map(a => a.name);
    const fromCases = cases.map(c => c.agentName);
    return Array.from(new Set([...fromDirectory, ...fromCases].filter(Boolean)));
  }, [cases, agentDirectory]);

  useEffect(() => { if (!simAgent && agents.length) setSimAgent(agents[0]); }, [agents, simAgent]);

  if (cases === null || agentDirectory === null || itemDirectory === null || shipmentBatches === null || docLogs === null) {
    return <div style={{ padding: 40, fontFamily: "'Inter', sans-serif", color: "#6B7686" }}>加载中…</div>;
  }

  const hash = typeof window !== "undefined" ? window.location.hash : "";
  const refMatch = hash.match(/^#ref=(.+)$/);
  const isReferralPortal = hash === "#referral" || !!refMatch;
  if (isReferralPortal) {
    return (
      <ReferralSubmitView
        presetCaseId={refMatch ? decodeURIComponent(refMatch[1]) : null}
        cases={cases}
        onSubmit={(updated) => persistCase(updated)}
      />
    );
  }

  const filteredAdminList = cases.filter(c => {
    const q = search.trim().toLowerCase();
    const matchSearch = !q
      || (c.customerName || "").toLowerCase().includes(q)
      || (c.agentName || "").toLowerCase().includes(q)
      || (c.customerPhone || "").toLowerCase().includes(q)
      || (c.customerEmail || "").toLowerCase().includes(q);
    const matchAgent = agentFilter === "全部" || c.agentName === agentFilter;
    const matchRange = (!listRangeStart && !listRangeEnd) || inRange(c.createdAt, listRangeStart || null, listRangeEnd || null);
    return matchSearch && matchAgent && matchRange;
  }).sort((a, b) => {
    const da = firstPaymentDate(a) || a.createdAt || "";
    const db = firstPaymentDate(b) || b.createdAt || "";
    return db.localeCompare(da);
  });

  const agentCases = cases.filter(c => c.agentName === simAgent);

  const openNew = () => requireLogin(() => setView({ screen: "form", editing: emptyCase(), isNew: true }));
  const openEdit = (c) => requireLogin(() => setView({ screen: "form", editing: structuredClone(c), isNew: false }));
  const saveCase = (c) => {
    const exists = cases.some(x => x.id === c.id);
    const prevCase = exists ? cases.find(x => x.id === c.id) : null;
    const departments = changedDepartments(prevCase, c);
    let withHistory = c;
    if (departments.length > 0) {
      const historyEntry = { id: uid(), editor: currentOperator ? currentOperator.name : "未知 Unknown", timestamp: new Date().toISOString(), departments };
      withHistory = { ...c, editHistory: [...(c.editHistory || []), historyEntry] };
    }
    persistCase(withHistory);
    setView({ screen: "form", editing: withHistory, isNew: false }); // stay on the form after saving
  };
  const deleteCase = (id) => requireLogin(() => { removeCase(id); setView({ screen: "list" }); });

  return (
    <div style={{
      minHeight: "100vh", background: "#F7F5F0", fontFamily: "'Inter', sans-serif",
      display: "flex", flexDirection: "column",
    }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
        * { box-sizing: border-box; }
        button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid #C89B3C; outline-offset: 1px; }
        @media print {
          body * { visibility: hidden !important; }
          .eternalgy-print-area, .eternalgy-print-area * { visibility: visible !important; }
          .eternalgy-print-area { position: fixed !important; left: 0; top: 0; width: 100%; margin: 0; }
          .no-print { display: none !important; }
        }
      `}</style>

      {/* top bar */}
      <div style={{ background: "#0B2A4A", padding: "14px 24px", display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ width: 34, height: 34, borderRadius: 9, background: "linear-gradient(135deg,#C89B3C,#0B2A4A)", display: "flex", alignItems: "center", justifyContent: "center" }}>
            <Sun size={18} color="#fff" />
          </div>
          <div>
            <div style={{ fontFamily: "'Space Grotesk', sans-serif", color: "#fff", fontWeight: 700, fontSize: 15.5, lineHeight: 1.1 }}>Eternalgy CRM</div>
            <div style={{ color: "#B9C4D6", fontSize: 11 }}>恒浩能源 · 案件管理系统</div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          {role === "admin" && currentOperator && (
            <div style={{ display: "flex", alignItems: "center", gap: 6, background: "rgba(255,255,255,0.1)", borderRadius: 9, padding: "6px 10px" }}>
              <span style={{ color: "#fff", fontSize: 12 }}>👤 {currentOperator.name}</span>
              <button onClick={() => setCurrentOperator(null)} style={{ background: "none", border: "none", color: "#C89B3C", fontSize: 11.5, cursor: "pointer", fontWeight: 600 }}>登出</button>
            </div>
          )}
          <RoleTab active={role === "admin" && view.screen === "dashboard"} onClick={() => { setRole("admin"); setView({ screen: "dashboard" }); }} icon={LayoutDashboard} label="数据总览 Dashboard" />
          <RoleTab active={role === "admin"} onClick={() => { setRole("admin"); setView({ screen: "list" }); }} icon={FolderKanban} label="Admin 总部" />
          <RoleTab active={role === "agent"} onClick={() => { setRole("agent"); setView({ screen: "agentList" }); }} icon={Link2} label="Agent 视角（模拟链接）" />
        </div>
      </div>

      <div style={{ flex: 1, padding: "24px", maxWidth: 1100, margin: "0 auto", width: "100%" }}>
        <PrintContext.Provider value={setPrintDoc}>
          {role === "admin" ? (
            <AdminArea
              cases={cases} view={view} setView={setView}
              search={search} setSearch={setSearch}
              agentFilter={agentFilter} setAgentFilter={setAgentFilter} agents={agents}
              listRangeStart={listRangeStart} setListRangeStart={setListRangeStart}
              listRangeEnd={listRangeEnd} setListRangeEnd={setListRangeEnd}
              filteredAdminList={filteredAdminList}
              openNew={openNew} openEdit={openEdit} saveCase={saveCase} deleteCase={deleteCase}
              agentDirectory={agentDirectory} saveAgent={saveAgent} deleteAgent={deleteAgent}
              itemDirectory={itemDirectory} saveItem={saveItem} deleteItem={deleteItem}
              shipmentBatches={shipmentBatches} saveBatch={saveBatch} deleteBatch={deleteBatch}
              docLogs={docLogs} logDoc={logDoc}
              adminDirectory={adminDirectory} saveAdminAccount={saveAdminAccount} deleteAdminAccount={deleteAdminAccount}
              currentOperator={currentOperator} setCurrentOperator={setCurrentOperator}
            />
          ) : (
            <AgentArea
              agents={agents} simAgent={simAgent} setSimAgent={setSimAgent}
              agentCases={agentCases} view={view} setView={setView}
              logDoc={logDoc}
            />
          )}
          <PrintOverlay doc={printDoc} onClose={() => setPrintDoc(null)} />
          {pendingLoginAction && (
            <LoginGate
              adminDirectory={adminDirectory || []}
              onSuccess={(account) => {
                setCurrentOperator(account);
                const action = pendingLoginAction;
                setPendingLoginAction(null);
                action();
              }}
              onCancel={() => setPendingLoginAction(null)}
            />
          )}
        </PrintContext.Provider>
      </div>
    </div>
  );
}

    <button onClick={onClick} style={{
      display: "flex", alignItems: "center", gap: 6, padding: "8px 14px", borderRadius: 9,
      border: "1px solid " + (active ? "#C89B3C" : "rgba(255,255,255,0.2)"),
      background: active ? "#C89B3C" : "transparent", color: active ? "#0B2A4A" : "#fff",
      fontSize: 12.5, fontWeight: 600, cursor: "pointer", fontFamily: "'Inter', sans-serif",
    }}>
      <Icon size={14} /> {label}
    </button>
  );
}

        </div>
      </div>
    </div>
  );
}

function AdminAccountDirectoryArea({ adminDirectory, saveAdminAccount, deleteAdminAccount }) {
  const [editing, setEditing] = useState(null);
  if (editing) {
    return (
      <div>
        <button onClick={() => setEditing(null)} style={{ ...btnGhost, marginBottom: 16 }}><ArrowLeft size={14}/> 返回列表</button>
        <h2 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 19, margin: "0 0 16px", color: "#1B2430" }}>
          {editing.isNew ? "新增员工账号" : "编辑员工账号"}
        </h2>
        <AdminAccountForm
          initial={editing.account}
          onSave={(a) => { saveAdminAccount(a); setEditing(null); }}
          onCancel={() => setEditing(null)}
          onDelete={editing.isNew ? null : () => { deleteAdminAccount(editing.account.id); setEditing(null); }}
        />
      </div>
    );
  }
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div style={{ fontSize: 12, color: "#9AA2AD" }}>共 {adminDirectory.length} 位员工 — 编辑Case前需要登入其中一个账号。忘记密码可以请其他同事帮忙在这里重设。</div>
        <button onClick={() => setEditing({ isNew: true, account: emptyAdminAccount() })} style={btnPrimary}><Plus size={14}/> 新增员工账号</button>
      </div>
      {adminDirectory.length === 0 ? (
        <div style={{ background: "#fff", border: "1px solid #E9E4D8", borderRadius: 14, padding: 24 }}>
          <Empty text="还没有员工账号，点右上角「新增员工账号」开始建档。" />
        </div>
      ) : (
        <div style={{ background: "#fff", border: "1px solid #E9E4D8", borderRadius: 14, overflow: "hidden", overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 480 }}>
            <thead>
              <tr style={{ background: "#FBFAF6", textAlign: "left" }}>
                <th style={thStyle}>姓名 Name</th>
                <th style={thStyle}>Email</th>
                <th style={thStyle}>电话 Phone</th>
                <th style={thStyle}>备注</th>
              </tr>
            </thead>
            <tbody>
              {adminDirectory.map(a => (
                <tr key={a.id} onClick={() => setEditing({ isNew: false, account: a })} style={{ borderTop: "1px solid #F0ECE1", cursor: "pointer" }}
                  onMouseEnter={e => e.currentTarget.style.background = "#FBFAF6"}
                  onMouseLeave={e => e.currentTarget.style.background = "transparent"}>
                  <td style={{ ...tdStyle, fontWeight: 600 }}>{a.name}</td>

function LoginGate({ adminDirectory, onSuccess, onCancel }) {
  const [name, setName] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const submit = () => {
    const match = adminDirectory.find(a => a.name === name && a.password === password);
    if (match) { onSuccess(match); }
    else { setError("姓名或密码不对，请再试一次 / Name or password incorrect."); }
  };
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(11,42,74,0.55)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200 }}>
      <div style={{ background: "#fff", borderRadius: 16, padding: 28, maxWidth: 380, width: "90%" }}>
        <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 17, marginBottom: 4 }}>员工登入 Staff Login</div>
        <div style={{ fontSize: 12.5, color: "#6B7686", marginBottom: 16 }}>修改Case资料前，请先确认你是谁 — 每次修改都会记录在案。</div>
        {adminDirectory.length === 0 ? (
          <div style={{ fontSize: 13, color: "#C24141" }}>还没有建立任何员工账号，请先去「员工管理」新增一个。</div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <Field label="姓名 Name">
              <select value={name} onChange={e => { setName(e.target.value); setError(""); }} style={inputStyle}>
                <option value="">选择你的名字…</option>
                {adminDirectory.map(a => <option key={a.id} value={a.name}>{a.name}</option>)}
              </select>
            </Field>
            <Field label="密码 Password">
              <input type="password" value={password} onChange={e => { setPassword(e.target.value); setError(""); }}
                onKeyDown={e => e.key === "Enter" && submit()} style={inputStyle} placeholder="密码" />
            </Field>
            {error && <div style={{ fontSize: 12, color: "#C24141" }}>{error}</div>}
            <button onClick={submit} disabled={!name || !password} style={{ ...btnPrimary, justifyContent: "center", opacity: (name && password) ? 1 : 0.45 }}>登入 Login</button>
          </div>
        )}
        <button onClick={onCancel} style={{ ...btnGhost, width: "100%", justifyContent: "center", marginTop: 10 }}>取消</button>
      </div>
    </div>
  );
}

function ItemForm({ initial, onSave, onCancel, onDelete, shippedMap }) {
  const [it, setIt] = useState(initial);
  const set = (field, value) => setIt(prev => ({ ...prev, [field]: value }));
  const addStockIn = () => setIt(prev => ({ ...prev, stockIns: [...(prev.stockIns || []), { id: uid(), date: todayISO(), qty: "", note: "" }] }));
  const updateStockIn = (id, field, value) => setIt(prev => ({ ...prev, stockIns: prev.stockIns.map(r => r.id === id ? { ...r, [field]: value } : r) }));
  const removeStockIn = (id) => setIt(prev => ({ ...prev, stockIns: prev.stockIns.filter(r => r.id !== id) }));
  const stock = shippedMap ? computeItemStock(it, shippedMap) : null;
  return (
    <div style={{ background: "#fff", border: "1px solid #E9E4D8", borderRadius: 14, padding: 18, display: "flex", flexDirection: "column", gap: 12, maxWidth: 560 }}>

          <TextInput value={it.name} onChange={e => set("name", e.target.value)} placeholder="如：650W JinkoSolar Tiger Neo 3.0" />
        </Field>
      </div>
      {it.category === "Panel" && (
        <Field label="功率 Watt (W)（用来自动算 kWp，选这个型号时会带入）">
          <NumberInput value={it.watt} onChange={e => set("watt", e.target.value)} placeholder="如 650" style={{ maxWidth: 200 }} />
        </Field>

          <div style={{ fontSize: 11, fontWeight: 700, color: "#9AA2AD", letterSpacing: 0.5 }}>进货记录 Stock In Records</div>
          {stock && (
            <div style={{ display: "flex", gap: 10, fontSize: 12, fontFamily: "'IBM Plex Mono', monospace" }}>
              <span>进货 In: <b>{stock.stockIn}</b></span>
              <span>已出货 Shipped: <b>{stock.shipped}</b></span>

          <div key={r.id} style={{ display: "grid", gridTemplateColumns: "155px 100px 1fr auto", gap: 8, alignItems: "center" }}>
            <DateInputDMY value={r.date} onChange={e => updateStockIn(r.id, "date", e.target.value)} />
            <NumberInput value={r.qty} onChange={e => updateStockIn(r.id, "qty", e.target.value)} placeholder="数量 Qty" />
            <TextInput value={r.note} onChange={e => updateStockIn(r.id, "note", e.target.value)} placeholder="备注 Note（如：供应商 / PO号）" />
            <button onClick={() => removeStockIn(r.id)} style={{ border: "none", background: "none", cursor: "pointer", color: "#C24141" }}>
              <Trash2 size={14} />
            </button>
          </div>

      <div style={{ display: "flex", justifyContent: "space-between" }}>

        <div style={{ display: "flex", gap: 10 }}>
          <button onClick={onCancel} style={btnGhost}>取消</button>
          <button onClick={() => onSave(it)} disabled={!it.name.trim()} style={{ ...btnPrimary, opacity: it.name.trim() ? 1 : 0.45 }}><Save size={14}/> 保存</button>
        </div>
      </div>
    </div>
  );
}

function ShipmentBatchArea({ batches, saveBatch, deleteBatch, cases }) {
  const [openId, setOpenId] = useState(null);
  const [customerQuery, setCustomerQuery] = useState("");

  const openBatch = openId ? batches.find(b => b.id === openId) : null;

  if (openBatch) {
    const batchCases = openBatch.caseIds.map(id => cases.find(c => c.id === id)).filter(Boolean);
    const candidates = customerQuery.trim()
      ? cases.filter(c =>
          !openBatch.caseIds.includes(c.id) &&
          !(c.cancellation && c.cancellation.isCancelled) &&
          (c.customerName || "").toLowerCase().includes(customerQuery.trim().toLowerCase())
        ).slice(0, 8)
      : [];

    const addCustomer = (caseId) => {
      const next = { ...openBatch, caseIds: [...openBatch.caseIds, caseId] };
      saveBatch(next);
      setCustomerQuery("");
    };
    const removeCustomer = (caseId) => {
      saveBatch({ ...openBatch, caseIds: openBatch.caseIds.filter(id => id !== caseId) });
    };
    const setLabel = (label) => saveBatch({ ...openBatch, label });
    const setShipDate = (key, value) => saveBatch({ ...openBatch, shipDates: { ...openBatch.shipDates, [key]: value } });
    const setNote = (note) => saveBatch({ ...openBatch, note });

    // Sum every case's items together by (key + model), so the same model across different
    // customers becomes one line with a combined quantity — exactly the "same product, added
    // together" behaviour from the Excel sheet.
    const { totals, order } = batchItemTotals(openBatch, cases);

    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <button onClick={() => setOpenId(null)} style={btnGhost}><ArrowLeft size={14}/> 返回批次列表</button>
          <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11.5, color: "#3C8C63", fontWeight: 600 }}>
            <CheckCircle2 size={13} /> 自动保存 Auto-saved — 打字/选好就立刻存档，不用另外按保存
          </div>
        </div>

        <div style={{ background: "#fff", border: "1px solid #E9E4D8", borderRadius: 14, padding: 18, display: "flex", flexDirection: "column", gap: 12 }}>
          <Field label="批次名称 Batch Label（例如：01/06 - 07/06 出货）">
            <TextInput value={openBatch.label} onChange={e => setLabel(e.target.value)} placeholder="第一批 / 01/06-07/06 …" />
          </Field>

          <div style={{ borderTop: "1px solid #F0ECE1", paddingTop: 12, display: "flex", flexDirection: "column", gap: 8 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: "#9AA2AD", letterSpacing: 0.5 }}>加入顾客 Add Customer（打名字，货物自动带出，不用手动填）</div>
            <div style={{ position: "relative" }}>
              <TextInput value={customerQuery} onChange={e => setCustomerQuery(e.target.value)} placeholder="打顾客名字搜索…" />
              {candidates.length > 0 && (
                <div style={{ position: "absolute", top: "100%", left: 0, right: 0, background: "#fff", border: "1px solid #E2DDD0", borderRadius: 8, marginTop: 4, zIndex: 10, boxShadow: "0 4px 12px rgba(0,0,0,0.08)" }}>
                  {candidates.map(c => (
                    <div key={c.id} onClick={() => addCustomer(c.id)}
                      style={{ padding: "8px 12px", cursor: "pointer", fontSize: 13, borderBottom: "1px solid #F0ECE1" }}
                      onMouseEnter={e => e.currentTarget.style.background = "#FBFAF6"}
                      onMouseLeave={e => e.currentTarget.style.background = "#fff"}>
                      <b>{c.customerName}</b> <span style={{ color: "#9AA2AD", fontSize: 11.5 }}>· {agentDisplay(c)}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>

          {batchCases.length > 0 && (
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {batchCases.map(c => {
                const items = caseShipItems(c);
                return (
                  <div key={c.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 10px", background: "#FBFAF6", borderRadius: 8, fontSize: 12.5 }}>
                    <div>
                      <b>{c.customerName || "-"}</b>
                      <span style={{ color: "#9AA2AD", marginLeft: 8 }}>
                        {items.length ? items.map(it => `${it.label} ${it.model} x${it.qty}`).join("　") : "没有可出货的项目"}
                      </span>
                    </div>
                    <button onClick={() => removeCustomer(c.id)} style={{ border: "none", background: "none", cursor: "pointer", color: "#C24141" }}>
                      <Trash2 size={14} />
                    </button>
                  </div>
                );
              })}
            </div>
          )}

          <div style={{ borderTop: "1px solid #F0ECE1", paddingTop: 12, display: "flex", flexDirection: "column", gap: 8 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: "#9AA2AD", letterSpacing: 0.5 }}>本批汇总 + 出货日期 Batch Totals + Ship Date（同样的货自动加总，日期自己填）</div>
            {order.length === 0 ? (
              <Empty text="还没有加顾客，加了之后这里会自动列出货物汇总。" />
            ) : (
              <div style={{ background: "#fff", border: "1px solid #E9E4D8", borderRadius: 10, overflow: "hidden" }}>
                <table style={{ width: "100%", borderCollapse: "collapse" }}>
                  <thead>
                    <tr style={{ background: "#FBFAF6", textAlign: "left" }}>
                      <th style={thStyle}>项目 Item</th>
                      <th style={thStyle}>型号 Model</th>
                      <th style={thStyle}>总数量 Total Qty</th>
                      <th style={thStyle}>出货日期 Ship Date</th>
                    </tr>
                  </thead>
                  <tbody>
                    {order.map(tk => {
                      const t = totals[tk];
                      return (
                        <tr key={tk} style={{ borderTop: "1px solid #F0ECE1" }}>
                          <td style={tdStyle}>{t.label}</td>
                          <td style={{ ...tdStyle, fontWeight: 600 }}>{t.model}</td>
                          <td style={{ ...tdStyle, fontFamily: "'IBM Plex Mono', monospace" }}>{t.qty}</td>
                          <td style={tdStyle}>
                            <DateInputDMY value={openBatch.shipDates[tk] || ""} onChange={e => setShipDate(tk, e.target.value)} />
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>

          <AdminNote value={openBatch.note} onChange={e => setNote(e.target.value)} />

          <div>
            <button onClick={() => { deleteBatch(openBatch.id); setOpenId(null); }} style={{ ...btnGhost, color: "#C24141", borderColor: "#F0C9C9" }}>
              <Trash2 size={13}/> 删除这个批次
            </button>
          </div>
        </div>
      </div>
    );
  }

  const sorted = batches.slice().sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div style={{ fontSize: 12, color: "#9AA2AD" }}>共 {batches.length} 个批次</div>
        <button onClick={() => { const b = emptyShipmentBatch(); saveBatch(b); setOpenId(b.id); }} style={btnPrimary}>
          <Plus size={14}/> 新增批次 New Batch
        </button>
      </div>
      {sorted.length === 0 ? (
        <div style={{ background: "#fff", border: "1px solid #E9E4D8", borderRadius: 14, padding: 24 }}>
          <Empty text="还没有出货批次，点右上角「新增批次」开始。" />
        </div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {sorted.map(b => {
            const pending = batchPendingCount(b, cases);
            const isPending = pending > 0;
            return (
              <div key={b.id} onClick={() => setOpenId(b.id)}
                style={{
                  background: isPending ? "#FFF8E8" : "#fff",
                  border: `1px solid ${isPending ? "#E8C87A" : "#E9E4D8"}`,
                  borderLeft: `4px solid ${isPending ? "#D98C3D" : "#E9E4D8"}`,
                  borderRadius: 12, padding: "12px 16px", cursor: "pointer",
                  display: "flex", justifyContent: "space-between", alignItems: "center",
                }}
                onMouseEnter={e => e.currentTarget.style.background = isPending ? "#FFF3D6" : "#FBFAF6"}
                onMouseLeave={e => e.currentTarget.style.background = isPending ? "#FFF8E8" : "#fff"}>
                <div>
                  <div style={{ fontWeight: 600, fontSize: 13.5, display: "flex", alignItems: "center", gap: 8 }}>
                    {b.label || "（未命名批次）"}
                    {isPending && <Badge color="#D98C3D">还有 {pending} 项未出货</Badge>}
                  </div>
                  <div style={{ fontSize: 11.5, color: "#9AA2AD" }}>{b.caseIds.length} 位顾客 · 建立于 {fmtDate(b.createdAt)}</div>
                </div>
                <ChevronRight size={16} color="#C9C2AE" />
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function ItemPicker({ category, itemDirectory, model, onModelChange, onDescriptionChange, onWattChange, placeholder }) {
  const options = (itemDirectory || []).filter(it => it.category === category);
  const matched = options.find(it => it.name === model);
  if (options.length === 0) {
    // Nothing registered yet for this category — fall back to manual typing so Admin isn't blocked.
    return <TextInput value={model} onChange={e => onModelChange(e.target.value)} placeholder={placeholder || "尚未建档，先手动输入 No items yet"} />;
  }
  return (
    <select
      value={matched ? matched.id : ""}
      onChange={e => {
        const it = options.find(o => o.id === e.target.value);
        if (it) { onModelChange(it.name); onDescriptionChange(it.description); if (onWattChange) onWattChange(it.watt || ""); }
        else { onModelChange(""); onDescriptionChange(""); if (onWattChange) onWattChange(""); }
      }}
      style={inputStyle}
    >
      <option value="">选择型号 Select…</option>
      {options.map(it => <option key={it.id} value={it.id}>{it.name}{it.watt ? ` (${it.watt}W)` : ""}</option>)}
    </select>
  );
}

/* ---------- CSV backup export ---------- */
function csvEscape(value) {
  const s = value === null || value === undefined ? "" : String(value);
  return `"${s.replace(/"/g, '""')}"`;
}
function exportCasesToCsv(cases) {
  const headers = [
    "Case Number", "Created At", "Customer Name", "Billing Name", "Phone", "Email",
    "Install Address", "IC/Passport", "TIN", "Agent Name", "Agent Code",
    "Package Type", "Property Type", "System Type", "Phase Type",
    "Selling Price (RM)", "Collected (RM)", "Balance (RM)", "Payment %",
    "First Payment Date", "Stage", "SEDA Submit Date", "SEDA Approval Date",
    "Last Install Date", "TNB Apply Date", "TNB Welcome Date",
    "Cancelled", "Cancel Date", "Full Record (JSON backup)",
  ];
  const rows = cases.map(c => {
    const price = Number(c.pkg.sellingPrice) || 0;
    const collected = paymentTotal(c);
    const stage = stageOf(c);
    return [
      c.caseNumber || c.id, c.createdAt, c.customerName, c.billingName, c.customerPhone, c.customerEmail,
      c.installAddress, c.ic, c.tin, c.agentName, c.agentCode,
      c.pkg.packageType, c.pkg.propertyType, c.pkg.systemType, c.pkg.phaseType,
      price, collected, price - collected, paymentPercent(c),
      firstPaymentDate(c) || "", `${stage.label} ${stage.en}`,
      c.seda.submitDate, c.seda.approvalDate,
      lastInstallDate(c) || "", c.tnb.applyDate, c.tnb.welcomeDate,
      c.cancellation && c.cancellation.isCancelled ? "Yes" : "No",
      (c.cancellation && c.cancellation.cancelDate) || "",
      JSON.stringify(c),
    ];
  });
  // Leading BOM so Excel opens the UTF-8 Chinese text correctly instead of mangling it.
  const csv = [headers, ...rows].map(row => row.map(csvEscape).join(",")).join("\r\n");
  const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `eternalgy-customers-backup-${todayISO()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

          <TabBtn active={view.screen === "admins"} onClick={() => setView({ screen: "admins" })} icon={ShieldCheck} label="员工管理 Staff Accounts" />
        </div>
      </div>

      {view.screen === "dashboard" ? (

/* ---------- Firebase Auth gate (Anonymous) ----------
   No login form: anyone who opens this file is silently signed in via Firebase Anonymous Auth
   and dropped straight into the CRM. This satisfies Firestore's "request.auth != null" rule but
   is NOT an access-control gate — it does not check identity or require a password. Anyone with
   the file/URL can read and write all customer data. */
function AuthGate() {
  const [ready, setReady] = useState(false);
  const [authError, setAuthError] = useState(null);

  useEffect(() => {
    const unsub = firebase.auth().onAuthStateChanged(user => {
      if (user) { setReady(true); }
      else {
        firebase.auth().signInAnonymously().catch(e => setAuthError(e.message || String(e)));
      }
    });
    return unsub;
  }, []);

  if (authError) {
    return (
      <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Inter', sans-serif", color: "#C24141", padding: 24, textAlign: "center" }}>
        登入失败 Sign-in failed: {authError}<br />
        （请确认 Firebase Console 里 Authentication → Sign-in method → Anonymous 已开启）
      </div>
    );
  }
  if (!ready) {
    return (
      <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Inter', sans-serif", color: "#6B7686" }}>
        加载中… Loading…
      </div>
    );
  }
  return <App />;
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<AuthGate />);
